<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulseCRM — анализ звонков</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:14px;background:#14151A;color:#F7F8F8;font-family:-apple-system,Arial,sans-serif;font-size:13px;}
  .btn{background:#C6F135;color:#0F1014;border:none;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;width:100%;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:transparent;border:1px solid #23252A;color:#F7F8F8;margin-top:8px;}
  .call-item{background:#1B1C22;border:1px solid #23252A;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .call-item:hover{border-color:#C6F135;}
  .call-date{color:#8A8F98;font-size:11px;}
  .call-dur{font-weight:600;font-size:12.5px;margin-top:2px;}
  .score{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;background:#1B1C22;border-radius:10px;}
  .score-num{font-weight:800;font-size:22px;}
  .lbl{color:#8A8F98;font-size:11px;}
  .analysis-text{white-space:pre-wrap;line-height:1.5;font-size:12.5px;max-height:220px;overflow-y:auto;}
  .lang-toggle{display:flex;gap:6px;margin-bottom:8px;}
  .lang-btn{background:#1B1C22;border:1px solid #23252A;color:#8A8F98;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;}
  .lang-btn.active{background:#C6F135;color:#0F1014;border-color:#C6F135;}
  .error{color:#EF4444;font-size:12.5px;}
  .hint{color:#8A8F98;font-size:11.5px;margin-top:8px;}
  audio{width:100%;margin-bottom:12px;height:32px;}
  .transcript-toggle{background:transparent;border:none;color:#8A8F98;font-size:11.5px;cursor:pointer;padding:8px 0 0;text-decoration:underline;}
  .transcript-box{white-space:pre-wrap;line-height:1.5;font-size:12px;color:#8A8F98;max-height:180px;overflow-y:auto;margin-top:8px;padding:10px 12px;background:#1B1C22;border-radius:10px;}
  #loader{display:flex;align-items:center;gap:8px;color:#8A8F98;font-size:12.5px;}
  .dot{width:5px;height:5px;border-radius:50%;background:#C6F135;animation:pulse 1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.15s;} .dot:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  .title{font-weight:700;font-size:13px;margin-bottom:10px;}
</style>
</head>
<body>
  <div id="root"><div class="hint">Загрузка…</div></div>

<script src="https://api.bitrix24.com/api/v1/"></script>
<script>
const WORKER_BASE = 'https://bold-breeze-9711.liverpoolonelove1.workers.dev';
const root = document.getElementById('root');
let calls = [];

function render(html){ root.innerHTML = html; try{ BX24.fitWindow(); }catch(e){} }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDur(sec){
  sec = parseInt(sec, 10) || 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function bx24Call(method, params){
  return new Promise((resolve, reject) => {
    BX24.callMethod(method, params, (result) => {
      if(result.error()){
        reject(new Error(result.error().ex ? result.error().ex.error_description : String(result.error())));
      } else {
        resolve(result.data());
      }
    });
  });
}

function renderCallList(){
  if(!calls.length){
    render(`<div class="hint">По этой сделке пока нет звонков с записью.</div>`);
    return;
  }
  const items = calls.map((c, i) => `
    <div class="call-item" data-idx="${i}">
      <div class="call-date">${new Date(c.CALL_START_DATE).toLocaleString('ru-RU')}</div>
      <div class="call-dur">${c.CALL_TYPE == 2 ? 'Входящий' : 'Исходящий'} · ${fmtDur(c.CALL_DURATION)}</div>
    </div>
  `).join('');
  render(`<div class="title">Звонки по этой сделке</div>${items}`);
  document.querySelectorAll('.call-item').forEach(el => {
    el.addEventListener('click', () => startAnalysis(calls[parseInt(el.dataset.idx, 10)]));
  });
}

function renderLoading(){
  render(`<div id="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Анализирую звонок…</div>`);
}
function renderError(msg){
  render(`
    <div class="error">Не удалось проанализировать: ${escapeHtml(msg)}</div>
    <button class="btn btn-secondary" id="backBtn" style="margin-top:10px;">Назад к списку звонков</button>
  `);
  document.getElementById('backBtn').addEventListener('click', renderCallList);
}
function renderResult(data, downloadUrl){
  const score = data.score;
  const color = score === null ? '#8A8F98' : score >= 8 ? '#C6F135' : score >= 5 ? '#F59E0B' : '#EF4444';
  const scoreHtml = score !== null ? `
    <div class="score">
      <div class="score-num" style="color:${color}">${score}<span style="font-size:13px;color:#8A8F98;">/10</span></div>
      <div class="lbl">Оценка звонка ИИ</div>
    </div>` : '';
  const audioHtml = downloadUrl ? `<audio controls src="${downloadUrl}" preload="none"></audio>` : '';
  const hasUz = !!(data.analysisUz && data.analysisUz.trim());
  const toggleHtml = hasUz ? `
    <div class="lang-toggle">
      <button class="lang-btn active" id="langRuBtn">RU</button>
      <button class="lang-btn" id="langUzBtn">UZ</button>
    </div>` : '';
  const hasTranscript = !!(data.transcript && data.transcript.trim());
  const transcriptHtml = hasTranscript ? `
    <button class="transcript-toggle" id="transcriptToggleBtn">Показать расшифровку</button>
    <div class="transcript-box" id="transcriptBox" style="display:none;">${escapeHtml(data.transcript)}</div>
  ` : '';
  render(`
    ${audioHtml}
    ${scoreHtml}
    ${toggleHtml}
    <div class="analysis-text" id="analysisTextBox">${escapeHtml(data.analysisRu || 'Нет ответа')}</div>
    ${transcriptHtml}
    <button class="btn btn-secondary" id="backBtn" style="margin-top:10px;">Назад к списку звонков</button>
  `);
  document.getElementById('backBtn').addEventListener('click', renderCallList);
  if(hasUz){
    const box = document.getElementById('analysisTextBox');
    const ruBtn = document.getElementById('langRuBtn');
    const uzBtn = document.getElementById('langUzBtn');
    ruBtn.addEventListener('click', () => { box.textContent = data.analysisRu; ruBtn.classList.add('active'); uzBtn.classList.remove('active'); });
    uzBtn.addEventListener('click', () => { box.textContent = data.analysisUz; uzBtn.classList.add('active'); ruBtn.classList.remove('active'); });
  }
  if(hasTranscript){
    const toggleBtn = document.getElementById('transcriptToggleBtn');
    const box = document.getElementById('transcriptBox');
    toggleBtn.addEventListener('click', () => {
      const isHidden = box.style.display === 'none';
      box.style.display = isHidden ? 'block' : 'none';
      toggleBtn.textContent = isHidden ? 'Скрыть расшифровку' : 'Показать расшифровку';
      try{ BX24.fitWindow(); }catch(e){}
    });
  }
}

async function startAnalysis(call){
  renderLoading();
  try{
    if(!call.RECORD_FILE_ID) throw new Error('У этого звонка нет записи');
    const file = await bx24Call('disk.file.get', {id: call.RECORD_FILE_ID});
    if(!file || !file.DOWNLOAD_URL) throw new Error('Запись недоступна — проверьте право "Диск" у приложения');
    const res = await fetch(`${WORKER_BASE}/analyze-recording-url`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({downloadUrl: file.DOWNLOAD_URL, fileName: file.NAME || ''})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    renderResult(data, file.DOWNLOAD_URL);
  }catch(e){
    renderError(e.message || String(e));
  }
}

async function loadCallsForDeal(){
  try{
    const placementInfo = BX24.placement.info();
    // Внутри карточки сделки контекст обычно называется ENTITY_ID (сама сделка)
    const dealId = placementInfo?.options?.ENTITY_ID || placementInfo?.options?.ID || null;
    if(!dealId) throw new Error('Не удалось определить сделку — виджет открыт не в карточке сделки');

    // Звонок клиенту в Bitrix24 почти всегда регистрируется на КОНТАКТЕ (или компании), а не
    // на самой сделке — сделка лишь показывает его в своей ленте через связь сделка→контакт.
    // Поэтому мало искать по CRM_ENTITY_TYPE=DEAL — нужно ещё узнать контакта/компанию сделки
    // и подтянуть звонки по ним тоже, иначе список почти всегда будет пустым.
    const deal = await bx24Call('crm.deal.get', {id: dealId});
    const entityFilters = [{'CRM_ENTITY_TYPE': 'DEAL', 'CRM_ENTITY_ID': dealId}];
    if(deal && deal.CONTACT_ID) entityFilters.push({'CRM_ENTITY_TYPE': 'CONTACT', 'CRM_ENTITY_ID': deal.CONTACT_ID});
    if(deal && deal.COMPANY_ID) entityFilters.push({'CRM_ENTITY_TYPE': 'COMPANY', 'CRM_ENTITY_ID': deal.COMPANY_ID});

    const results = await Promise.all(entityFilters.map(filter =>
      bx24Call('voximplant.statistic.get', {filter, order: {'CALL_START_DATE': 'DESC'}}).catch(() => [])
    ));
    const merged = results.flat().filter(Boolean);
    const seenIds = new Set();
    calls = merged
      .filter(c => c.RECORD_FILE_ID && !seenIds.has(c.ID) && seenIds.add(c.ID))
      .sort((a, b) => new Date(b.CALL_START_DATE) - new Date(a.CALL_START_DATE));
    renderCallList();
  }catch(e){
    render(`<div class="error">${escapeHtml(e.message || String(e))}</div>`);
  }
}

BX24.init(function(){
  loadCallsForDeal();
});
</script>
</body>
</html>
