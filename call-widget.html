<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulseCRM — анализ звонков</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:14px;background:#FFFFFF;color:#1F2126;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;}
  .btn{background:#B9E62E;color:#14210A;border:none;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;width:100%;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:#FFFFFF;border:1px solid #DEE1E6;color:#1F2126;margin-top:8px;}
  .call-item{background:#F5F6F8;border:1px solid #E3E5E8;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .call-item:hover{border-color:#8FB828;}
  .call-date{color:#70757D;font-size:11px;}
  .call-dur{font-weight:600;font-size:12.5px;margin-top:2px;}
  .score{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;background:#F5F6F8;border-radius:10px;}
  .score-num{font-weight:800;font-size:22px;}
  .lbl{color:#70757D;font-size:11px;}
  .analysis-text{white-space:pre-wrap;line-height:1.5;font-size:12.5px;max-height:220px;overflow-y:auto;}
  .lang-toggle{display:flex;gap:6px;margin-bottom:8px;}
  .lang-btn{background:#F5F6F8;border:1px solid #E3E5E8;color:#70757D;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;}
  .lang-btn.active{background:#B9E62E;color:#14210A;border-color:#B9E62E;}
  .error{color:#D6362B;font-size:12.5px;}
  .hint{color:#70757D;font-size:11.5px;margin-top:8px;}
  audio{width:100%;margin-bottom:12px;height:32px;}
  .transcript-toggle{background:transparent;border:none;color:#70757D;font-size:11.5px;cursor:pointer;padding:8px 0 0;text-decoration:underline;}
  .transcript-box{white-space:pre-wrap;line-height:1.5;font-size:12px;color:#4A4E56;max-height:180px;overflow-y:auto;margin-top:8px;padding:10px 12px;background:#F5F6F8;border-radius:10px;}
  #loader{display:flex;align-items:center;gap:8px;color:#70757D;font-size:12.5px;}
  .dot{width:5px;height:5px;border-radius:50%;background:#8FB828;animation:pulse 1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.15s;} .dot:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  .title{font-weight:700;font-size:13px;margin-bottom:10px;color:#1F2126;}
  .coach-card{background:#F5F6F8;border:1px solid #E3E5E8;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .coach-note{font-size:11.5px;color:#70757D;margin-bottom:10px;line-height:1.4;}
  .coach-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .coach-chip{background:#F5F6F8;border:1px solid #E3E5E8;border-radius:20px;padding:6px 12px;font-size:11.5px;color:#1F2126;cursor:pointer;}
  .coach-chip:hover{border-color:#8FB828;}
  .coach-log{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin-bottom:10px;}
  .coach-log-q{align-self:flex-end;background:#1F2126;color:#fff;border-radius:12px 12px 2px 12px;padding:7px 11px;font-size:12px;max-width:88%;}
  .coach-log-a{align-self:flex-start;background:#F5F6F8;border:1px solid #E3E5E8;border-radius:12px 12px 12px 2px;padding:9px 11px;font-size:12.5px;line-height:1.45;max-width:92%;white-space:pre-line;}
  .coach-input-row{display:flex;gap:6px;margin-bottom:8px;}
  .coach-input-row input{flex:1;border:1px solid #E3E5E8;border-radius:9px;padding:8px 10px;font-size:12.5px;background:#FFFFFF;color:#1F2126;min-width:0;}
  .coach-send-btn{background:#B9E62E;color:#14210A;border:none;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer;font-size:12.5px;flex:none;}
  .coach-send-btn:disabled{opacity:.5;cursor:default;}
  .criteria-block{margin-bottom:12px;}
  .criteria-row{margin-bottom:8px;}
  .criteria-row:last-child{margin-bottom:0;}
  .criteria-label-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#4A4E56;margin-bottom:4px;}
  .criteria-pct{font-weight:700;flex:none;}
  .criteria-bar-track{background:#EEF0F2;border-radius:6px;height:6px;overflow:hidden;}
  .criteria-bar-fill{height:100%;border-radius:6px;}
  .report-card{background:#F5F6F8;border:1px solid #E3E5E8;border-radius:10px;padding:11px 12px;margin-bottom:10px;}
  .report-card-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;margin-bottom:8px;}
  .report-card ul{margin:0;padding:0;list-style:none;}
  .report-card li{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.4;color:#2B2D33;margin-bottom:6px;}
  .report-card li:last-child{margin-bottom:0;}
  .report-card li:before{content:'';flex:none;width:5px;height:5px;border-radius:50%;margin-top:6px;background:currentColor;}
  .report-card.strengths .report-card-title{color:#6B9600;}
  .report-card.strengths li{color:#3A5100;}
  .report-card.improvements .report-card-title{color:#B8790A;}
  .report-card.improvements li{color:#6B4E0A;}
  .report-card.recommendations .report-card-title{color:#2B6CB0;}
  .report-card.recommendations li{color:#1E4E80;}
</style>
</head>
<body>
  <div id="root"><div class="hint">Загрузка…</div></div>

<script src="https://api.bitrix24.com/api/v1/"></script>
<script>
const WORKER_BASE = 'https://bold-breeze-9711.liverpoolonelove1.workers.dev';
const AI_PROXY_URL = `${WORKER_BASE}/ai`;
const root = document.getElementById('root');
let calls = [];
let currentDealId = null;
let coachCallContext = null;
let coachHistory = [];

const COACH_CHIPS = [
  'Как лучше отвечать на возражение "дорого"?',
  'Как уверенно закрывать сделку в конце разговора?',
  'Как расположить к себе клиента в начале звонка?',
  'Что мне стоит улучшить в моих разговорах?'
];

function render(html){ root.innerHTML = html; try{ BX24.fitWindow(); }catch(e){} }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDur(sec){
  sec = parseInt(sec, 10) || 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function bx24Call(method, params){
  return new Promise((resolve, reject) => {
    BX24.callMethod(method, params, (result) => {
      if(result.error()){
        reject(new Error(result.error().ex ? result.error().ex.error_description : String(result.error())));
      } else {
        resolve(result.data());
      }
    });
  });
}

function renderCallList(){
  const topBtnsHtml = `
    <div style="display:flex;gap:14px;margin-bottom:10px;">
      <button class="transcript-toggle" id="showRatingsBtn" style="padding:0;">📊 Рейтинг менеджеров</button>
      <button class="transcript-toggle" id="showCoachBtn" style="padding:0;">🤖 ИИ-тренер</button>
    </div>`;
  if(!calls.length){
    render(`${topBtnsHtml}<div class="hint">По этой сделке пока нет звонков с записью.</div>`);
    document.getElementById('showRatingsBtn').addEventListener('click', showManagerRatings);
    document.getElementById('showCoachBtn').addEventListener('click', () => showCoachChat(null));
    return;
  }
  const items = calls.map((c, i) => `
    <div class="call-item" data-idx="${i}">
      <div class="call-date">${new Date(c.CALL_START_DATE).toLocaleString('ru-RU')}</div>
      <div class="call-dur">${c.CALL_TYPE == 2 ? 'Входящий' : 'Исходящий'} · ${fmtDur(c.CALL_DURATION)}</div>
    </div>
  `).join('');
  render(`${topBtnsHtml}<div class="title">Звонки по этой сделке</div>${items}`);
  document.getElementById('showRatingsBtn').addEventListener('click', showManagerRatings);
  document.getElementById('showCoachBtn').addEventListener('click', () => showCoachChat(null));
  document.querySelectorAll('.call-item').forEach(el => {
    el.addEventListener('click', () => startAnalysis(calls[parseInt(el.dataset.idx, 10)]));
  });
}

async function showManagerRatings(){
  render(`<div id="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Загружаю рейтинг…</div>`);
  try{
    const res = await fetch(`${WORKER_BASE}/call-ratings`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({portal: BX24.getDomain()})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const ratings = (data.ratings || []).filter(r => r.managerId !== 'unknown');
    if(!ratings.length){
      render(`<div class="hint">Пока нет проанализированных звонков для рейтинга.</div><button class="btn btn-secondary" id="backBtn" style="margin-top:10px;">Назад</button>`);
      document.getElementById('backBtn').addEventListener('click', renderCallList);
      return;
    }
    // Имена менеджеров — рейтинг хранит только ID, подтягиваем реальные имена одним запросом
    let names = {};
    try{
      const users = await bx24Call('user.get', {filter: {ID: ratings.map(r => r.managerId)}});
      (users || []).forEach(u => { names[u.ID] = `${u.NAME || ''} ${u.LAST_NAME || ''}`.trim() || `ID ${u.ID}`; });
    }catch(e){ /* не получилось — просто покажем ID вместо имени */ }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = ratings.map((r, i) => {
      const name = names[r.managerId] || `ID ${r.managerId}`;
      const scoreStr = r.avgScore !== null ? `${r.avgScore}/10` : '—';
      const color = r.avgScore === null ? '#70757D' : r.avgScore >= 8 ? '#6B9600' : r.avgScore >= 5 ? '#B8790A' : '#D6362B';
      const medal = medals[i] ? `${medals[i]} ` : '';
      return `<div class="call-item" style="cursor:default;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:600;font-size:12.5px;">${medal}${escapeHtml(name)}</div>
          <div class="call-date">${r.count} ${r.count === 1 ? 'звонок' : 'звонков'}</div>
        </div>
        <div style="font-weight:800;font-size:16px;color:${color};">${scoreStr}</div>
      </div>`;
    }).join('');
    render(`<div class="title">Рейтинг менеджеров по звонкам</div>${rows}<button class="btn btn-secondary" id="backBtn" style="margin-top:10px;">Назад</button>`);
    document.getElementById('backBtn').addEventListener('click', renderCallList);
  }catch(e){
    render(`<div class="error">Не удалось загрузить рейтинг: ${escapeHtml(e.message || String(e))}</div><button class="btn btn-secondary" id="backBtn" style="margin-top:10px;">Назад</button>`);
    document.getElementById('backBtn').addEventListener('click', renderCallList);
  }
}

// ИИ-тренер для менеджера — персональный чат с советами по продажам и переговорам с клиентами
// (общая аналитика по компании уже есть в самом дашборде, здесь фокус узкий: как менеджеру
// разговаривать и закрывать сделки лучше). Использует тот же прокси /ai, что и чат в дашборде.
async function showCoachChat(callCtx){
  coachCallContext = callCtx;
  coachHistory = [];
  render(`<div id="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Открываю ИИ-тренера…</div>`);

  let statCardHtml = '';
  try{
    const [user, ratingsData] = await Promise.all([
      bx24Call('user.current', {}).catch(() => null),
      fetch(`${WORKER_BASE}/call-ratings`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({portal: BX24.getDomain()})
      }).then(r => r.json()).catch(() => null)
    ]);
    const myId = user && user.ID ? String(user.ID) : null;
    const mine = myId && ratingsData && ratingsData.ratings ? ratingsData.ratings.find(r => String(r.managerId) === myId) : null;
    if(mine){
      const scoreStr = mine.avgScore !== null ? `${mine.avgScore}/10` : '—';
      const color = mine.avgScore === null ? '#70757D' : mine.avgScore >= 8 ? '#6B9600' : mine.avgScore >= 5 ? '#B8790A' : '#D6362B';
      statCardHtml = `<div class="coach-card">
        <div>
          <div style="font-weight:600;font-size:12.5px;">Ваш средний балл за звонки</div>
          <div class="call-date">${mine.count} ${mine.count === 1 ? 'звонок проанализирован' : 'звонков проанализировано'}</div>
        </div>
        <div style="font-weight:800;font-size:18px;color:${color};">${scoreStr}</div>
      </div>`;
    }
  }catch(e){ /* без карточки статистики тоже можно работать */ }

  const contextNoteHtml = coachCallContext
    ? `<div class="coach-note">💬 Разбираем конкретный звонок (оценка ${coachCallContext.score ?? '—'}/10) — можно спрашивать про него.</div>`
    : '';
  const chipsHtml = `<div class="coach-chips">${COACH_CHIPS.map(q => `<button type="button" class="coach-chip" data-ask="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join('')}</div>`;

  render(`
    <div class="title">🤖 ИИ-тренер по продажам</div>
    ${statCardHtml}
    ${contextNoteHtml}
    ${chipsHtml}
    <div class="coach-log" id="coachLog"></div>
    <div class="coach-input-row">
      <input type="text" id="coachInput" placeholder="Спросите, как улучшить разговор с клиентом…">
      <button class="coach-send-btn" id="coachSendBtn">→</button>
    </div>
    <button class="btn btn-secondary" id="backBtn">Назад</button>
  `);

  document.getElementById('backBtn').addEventListener('click', renderCallList);
  document.querySelectorAll('.coach-chip').forEach(el => {
    el.addEventListener('click', () => coachAsk(el.dataset.ask));
  });
  const input = document.getElementById('coachInput');
  document.getElementById('coachSendBtn').addEventListener('click', () => {
    coachAsk(input.value);
    input.value = '';
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      coachAsk(input.value);
      input.value = '';
    }
  });
}

function buildCoachPrompt(query){
  let ctx = `Ты — персональный ИИ-тренер по продажам для менеджера, который работает в CRM PulseCRM. Помогаешь конкретному менеджеру: разбираешь его звонки, советуешь формулировки, как отвечать на возражения и увереннее закрывать сделки. Отвечай кратко и по делу (3-6 предложений), на русском языке, обращайся на "вы".\n`;
  if(coachCallContext){
    ctx += `\n[РАЗБИРАЕМЫЙ ЗВОНОК]\nОценка ИИ: ${coachCallContext.score ?? '—'}/10\nРазбор звонка: ${coachCallContext.analysisRu || '—'}\n`;
    if(coachCallContext.dialogue) ctx += `Диалог (кто что говорил):\n${coachCallContext.dialogue.slice(0, 2000)}\n`;
  }
  if(coachHistory.length){
    ctx += `\n[ПРЕДЫДУЩАЯ ПЕРЕПИСКА С ТРЕНЕРОМ]\n`;
    coachHistory.slice(-6).forEach(m => { ctx += `${m.role === 'user' ? 'Менеджер' : 'Тренер'}: ${m.text}\n`; });
  }
  ctx += `\nВОПРОС МЕНЕДЖЕРА: ${query}`;
  return ctx;
}

async function coachAsk(query){
  if(!query || !query.trim()) return;
  const log = document.getElementById('coachLog');
  if(!log) return;

  const qDiv = document.createElement('div');
  qDiv.className = 'coach-log-q';
  qDiv.textContent = query;
  log.appendChild(qDiv);

  const aDiv = document.createElement('div');
  aDiv.className = 'coach-log-a';
  aDiv.textContent = 'Тренер печатает…';
  log.appendChild(aDiv);
  log.scrollTop = log.scrollHeight;
  try{ BX24.fitWindow(); }catch(e){}

  const prompt = buildCoachPrompt(query);
  let answer;
  try{
    const res = await fetch(AI_PROXY_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    answer = data.answer || 'ИИ не ответил';
  }catch(e){
    answer = `Не удалось получить ответ: ${e.message || String(e)}`;
  }
  aDiv.textContent = answer;
  coachHistory.push({role: 'user', text: query});
  coachHistory.push({role: 'coach', text: answer});
  log.scrollTop = log.scrollHeight;
  try{ BX24.fitWindow(); }catch(e){}
}

function renderLoading(){
  render(`<div id="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Анализирую звонок…</div>`);
}
function renderError(msg){
  render(`
    <div class="error">Не удалось проанализировать: ${escapeHtml(msg)}</div>
    <button class="btn btn-secondary" id="backBtn" style="margin-top:10px;">Назад к списку звонков</button>
  `);
  document.getElementById('backBtn').addEventListener('click', renderCallList);
}
function renderResult(data, downloadUrl, call){
  const score = data.score;
  const color = score === null ? '#70757D' : score >= 8 ? '#6B9600' : score >= 5 ? '#B8790A' : '#D6362B';
  const scoreHtml = score !== null ? `
    <div class="score">
      <div class="score-num" style="color:${color}">${score}<span style="font-size:13px;color:#70757D;">/10</span></div>
      <div class="lbl">Оценка звонка ИИ</div>
    </div>` : '';
  const audioHtml = downloadUrl ? `<audio controls src="${downloadUrl}" preload="none"></audio>` : '';
  // Результат уже был сохранён с прошлого раза — показываем сразу, без повторной (платной)
  // транскрипции, но даём явную возможность переанализировать, если запись перезаписали и т.п.
  const cachedHtml = data.cached ? `<div class="hint" style="margin-bottom:10px;">Звонок уже анализировался ранее — показан сохранённый результат. <button class="transcript-toggle" id="reanalyzeBtn" style="padding:0;display:inline;">Переанализировать</button></div>` : '';
  const hasUz = !!(data.analysisUz && data.analysisUz.trim());
  const toggleHtml = hasUz ? `
    <div class="lang-toggle">
      <button class="lang-btn active" id="langRuBtn">RU</button>
      <button class="lang-btn" id="langUzBtn">UZ</button>
    </div>` : '';
  // Диалог по репликам (Менеджер/Клиент) — вместо плоской расшифровки
  const hasDialogue = !!(data.dialogue && data.dialogue.trim());
  const dialogueLinesHtml = hasDialogue ? data.dialogue.split('\n').map(line => {
    const m = line.match(/^(Менеджер|Клиент)\s*:\s*(.*)$/i);
    if(!m) return `<div>${escapeHtml(line)}</div>`;
    const isManager = /менеджер/i.test(m[1]);
    return `<div style="margin-bottom:6px;"><span style="font-weight:700;color:${isManager ? '#6B9600' : '#70757D'};">${escapeHtml(m[1])}:</span> ${escapeHtml(m[2])}</div>`;
  }).join('') : '';
  const dialogueHtml = hasDialogue ? `
    <button class="transcript-toggle" id="dialogueToggleBtn">Показать диалог (кто что говорил)</button>
    <div class="transcript-box" id="dialogueBox" style="display:none;">${dialogueLinesHtml}</div>
  ` : '';

  // Карточки отчёта (соответствие критериям + сильные стороны/точки роста/рекомендации) —
  // появились не во всех записях: старые звонки в кэше проанализированы до этого формата,
  // поэтому каждый блок рисуется только если данные реально пришли.
  const barColor = pct => pct >= 80 ? '#6B9600' : pct >= 50 ? '#B8790A' : '#D6362B';
  const criteriaHtml = (data.criteria && data.criteria.length) ? `
    <div class="criteria-block">
      ${data.criteria.map(c => `
        <div class="criteria-row">
          <div class="criteria-label-row">
            <span>${escapeHtml(c.label)}</span>
            <span class="criteria-pct" style="color:${barColor(c.pct)}">${c.pct}%</span>
          </div>
          <div class="criteria-bar-track"><div class="criteria-bar-fill" style="width:${c.pct}%;background:${barColor(c.pct)}"></div></div>
        </div>
      `).join('')}
    </div>
  ` : '';
  const reportCard = (cls, icon, title, items) => (items && items.length) ? `
    <div class="report-card ${cls}">
      <div class="report-card-title">${icon} ${title}</div>
      <ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
    </div>
  ` : '';
  const reportCardsHtml = reportCard('strengths', '⭐', 'Сильные стороны', data.strengths)
    + reportCard('improvements', '🎯', 'Точки роста', data.improvements)
    + reportCard('recommendations', '💡', 'Рекомендации', data.recommendations);

  render(`
    ${cachedHtml}
    ${audioHtml}
    ${scoreHtml}
    ${criteriaHtml}
    ${toggleHtml}
    <div class="analysis-text" id="analysisTextBox">${escapeHtml(data.analysisRu || 'Нет ответа')}</div>
    ${reportCardsHtml}
    ${dialogueHtml}
    <button class="btn" id="coachAboutCallBtn" style="margin-top:10px;">🤖 Обсудить этот звонок с ИИ-тренером</button>
    <button class="btn btn-secondary" id="backBtn" style="margin-top:8px;">Назад к списку звонков</button>
  `);
  document.getElementById('backBtn').addEventListener('click', renderCallList);
  document.getElementById('coachAboutCallBtn').addEventListener('click', () => showCoachChat({
    score: data.score,
    analysisRu: data.analysisRu || '',
    dialogue: data.dialogue || ''
  }));
  if(data.cached && call){
    document.getElementById('reanalyzeBtn').addEventListener('click', () => startAnalysis(call, true));
  }
  if(hasUz){
    const box = document.getElementById('analysisTextBox');
    const ruBtn = document.getElementById('langRuBtn');
    const uzBtn = document.getElementById('langUzBtn');
    ruBtn.addEventListener('click', () => { box.textContent = data.analysisRu; ruBtn.classList.add('active'); uzBtn.classList.remove('active'); });
    uzBtn.addEventListener('click', () => { box.textContent = data.analysisUz; uzBtn.classList.add('active'); ruBtn.classList.remove('active'); });
  }
  if(hasDialogue){
    const toggleBtn = document.getElementById('dialogueToggleBtn');
    const box = document.getElementById('dialogueBox');
    toggleBtn.addEventListener('click', () => {
      const isHidden = box.style.display === 'none';
      box.style.display = isHidden ? 'block' : 'none';
      toggleBtn.textContent = isHidden ? 'Скрыть диалог' : 'Показать диалог (кто что говорил)';
      try{ BX24.fitWindow(); }catch(e){}
    });
  }
}

async function startAnalysis(call, forceReanalyze){
  renderLoading();
  try{
    if(!call.RECORD_FILE_ID) throw new Error('У этого звонка нет записи');
    const file = await bx24Call('disk.file.get', {id: call.RECORD_FILE_ID});
    if(!file || !file.DOWNLOAD_URL) throw new Error('Запись недоступна — проверьте право "Диск" у приложения');
    const res = await fetch(`${WORKER_BASE}/analyze-recording-url`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        downloadUrl: file.DOWNLOAD_URL,
        fileName: file.NAME || '',
        portal: BX24.getDomain(),
        callId: call.ID,
        dealId: currentDealId,
        managerId: call.PORTAL_USER_ID,
        forceReanalyze: !!forceReanalyze
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    renderResult(data, file.DOWNLOAD_URL, call);
  }catch(e){
    renderError(e.message || String(e));
  }
}

async function loadCallsForDeal(){
  try{
    const placementInfo = BX24.placement.info();
    // Внутри карточки сделки контекст обычно называется ENTITY_ID (сама сделка)
    const dealId = placementInfo?.options?.ENTITY_ID || placementInfo?.options?.ID || null;
    if(!dealId) throw new Error('Не удалось определить сделку — виджет открыт не в карточке сделки');
    currentDealId = dealId;

    // Звонок клиенту в Bitrix24 почти всегда регистрируется на КОНТАКТЕ (или компании), а не
    // на самой сделке — сделка лишь показывает его в своей ленте через связь сделка→контакт.
    // Поэтому мало искать по CRM_ENTITY_TYPE=DEAL — нужно ещё узнать контакта/компанию сделки
    // и подтянуть звонки по ним тоже, иначе список почти всегда будет пустым.
    const deal = await bx24Call('crm.deal.get', {id: dealId});
    const entityFilters = [{'CRM_ENTITY_TYPE': 'DEAL', 'CRM_ENTITY_ID': dealId}];
    if(deal && deal.CONTACT_ID) entityFilters.push({'CRM_ENTITY_TYPE': 'CONTACT', 'CRM_ENTITY_ID': deal.CONTACT_ID});
    if(deal && deal.COMPANY_ID) entityFilters.push({'CRM_ENTITY_TYPE': 'COMPANY', 'CRM_ENTITY_ID': deal.COMPANY_ID});

    const results = await Promise.all(entityFilters.map(filter =>
      bx24Call('voximplant.statistic.get', {filter, order: {'CALL_START_DATE': 'DESC'}}).catch(() => [])
    ));
    const merged = results.flat().filter(Boolean);
    const seenIds = new Set();
    calls = merged
      .filter(c => c.RECORD_FILE_ID && !seenIds.has(c.ID) && seenIds.add(c.ID))
      .sort((a, b) => new Date(b.CALL_START_DATE) - new Date(a.CALL_START_DATE));
    renderCallList();
  }catch(e){
    render(`<div class="error">${escapeHtml(e.message || String(e))}</div>`);
  }
}

BX24.init(function(){
  loadCallsForDeal();
});
</script>
